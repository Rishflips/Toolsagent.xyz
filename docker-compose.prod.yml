version: '3.9'

# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The goal is a single public surface. Nothing but the frontend should ever be
# reachable from outside the host.
#
# Note on `!reset`: docker compose MERGES the ports lists from the base file and
# this one — it appends rather than replaces. So writing `ports: []` here does
# NOT remove the base mapping; the backend kept binding 0.0.0.0:4000. `!reset`
# is the Compose directive that genuinely clears the inherited value. Requires
# Compose 2.24+ (this deployment runs 2.40.3).

services:

  db:
    restart: always
    ports: !reset []                  # never publish the database
    environment:
      POSTGRES_DB:       toolsagent
      POSTGRES_USER:     toolsagent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command:
      - postgres
      - -c
      - max_connections=50            # modest box; the default 100 is wasteful
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: always
    ports: !reset []                  # reachable ONLY via the frontend proxy
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    # `!reset` is required here too. The base file publishes
    # "${FRONTEND_PORT:-3000}:80", and because compose merges port LISTS, a
    # plain override would leave BOTH mappings in place — the same host port
    # bound twice, which fails with "address already in use". Reset first, then
    # declare the single mapping we actually want.
    #
    # Default bind is loopback: safe behind a tunnel or same-host reverse proxy,
    # and exposes nothing if neither is present. Set FRONTEND_BIND=0.0.0.0 only
    # when something is deliberately in front of it.
    ports: !reset
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
